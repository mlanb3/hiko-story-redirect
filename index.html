<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hiko Story</title>
  <meta http-equiv="refresh" content="0;url=https://hiko-story.com/">
  <link rel="canonical" href="https://hiko-story.com/">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#111114;
      color:#f4f4f5;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main{
      width:min(520px,100%);
      padding:32px;
      text-align:center;
      border:1px solid #34343a;
      border-radius:20px;
      background:#1a1a1e;
      box-shadow:0 24px 70px rgba(0,0,0,.35);
    }
    h1{margin:0 0 12px;font-size:clamp(2rem,7vw,3rem)}
    p{margin:0 0 20px;color:#c7c7cc;line-height:1.6}
    a{
      display:inline-block;
      padding:11px 16px;
      border:1px solid #505057;
      border-radius:999px;
      background:#2b2b30;
      color:#fff;
      text-decoration:none;
      font-weight:700;
    }
    a:hover{background:#38383e}
  </style>
  <script>
    window.location.replace("https://hiko-story.com/" + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <main>
    <h1>Hiko Story</h1>
    <p>Hiko Story a déménagé. Redirection vers la nouvelle adresse…</p>
    <a href="https://hiko-story.com/">Continuer vers Hiko Story</a>
  </main>
</body>
</html>
